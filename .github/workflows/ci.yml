name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install and check functions and scripts
        run: |
          for directory in appwrite functions/*; do
            echo "::group::$directory"
            if [ -f "$directory/package-lock.json" ]; then
              npm ci --prefix "$directory"
            else
              npm install --no-package-lock --prefix "$directory"
            fi
            find "$directory" -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
            echo "::endgroup::"
          done
